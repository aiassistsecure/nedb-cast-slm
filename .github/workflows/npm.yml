name: npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (false = build + test only)'
        type: boolean
        default: false

# The napi binding cannot be built in the dev sandbox — no C linker, and napi's
# proc-macros must compile. So CI is where it gets built, tested, and published.
# Every platform is a real runner with a real toolchain.

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps
        working-directory: npm/nedb-cast
        run: npm install

      - name: Build native addon
        working-directory: npm/nedb-cast
        run: npx napi build --platform --release --target ${{ matrix.target }}

      # Only the host-native target can actually run here; cross-compiled
      # artifacts are exercised on their own runners.
      - name: Smoke test the addon
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: npm/nedb-cast
        run: node test.js

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: npm/nedb-cast/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes publish automatically; manual runs require opting in.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        working-directory: npm/nedb-cast
        run: npm install

      - uses: actions/download-artifact@v4
        with:
          path: npm/nedb-cast/artifacts

      - name: Assemble per-platform packages
        working-directory: npm/nedb-cast
        run: |
          find artifacts -name '*.node' -exec cp {} . \;
          ls -la *.node
          npx napi create-npm-dir -t .
          npx napi artifacts

      - name: Publish
        working-directory: npm/nedb-cast
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN not set — skipping publish"
            exit 0
          fi
          npx napi prepublish -t . --skip-gh-release
          npm publish --access public || \
            echo "::warning::npm publish returned non-zero (version may already exist)"
