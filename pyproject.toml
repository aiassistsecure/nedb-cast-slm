[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nedb-cast-slm"
version = "0.1.0"
description = "A 3.3M-parameter small language model that casts short prompts into NEDB query plans, with causal provenance in the engine itself."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [{ name = "Interchained LLC" }]
keywords = [
    "nedb", "slm", "small-language-model", "nql", "text-to-query",
    "provenance", "causal", "transformer", "cpu-training",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "nedb-engine>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://interchained.org"
Repository = "https://github.com/Eth-Interchained/nedb-cast-slm"
Engine = "https://github.com/Eth-Interchained/nedb"

[project.scripts]
cast = "cast.cli:main"

[tool.setuptools]
packages = ["cast"]

[tool.setuptools.package-data]
cast = ["py.typed"]
